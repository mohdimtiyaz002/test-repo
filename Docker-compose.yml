version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi-backend
    volumes:
      - userdata:/app/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: static-frontend
    ports:
      - "80:80"

volumes:
  userdata:

secrets:
username: testuser
password: "ADMIN"



